<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d0a"/>
      <stop offset="100%" stop-color="#111b13"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c3925" stroke-width=".6" opacity=".35"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screen">
      <rect width="1200" height="320" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <rect x="1" y="1" width="1198" height="318" rx="12"
          fill="none" stroke="#285d36" stroke-width="2"/>

    <!-- Terminal header -->
    <rect x="0" y="0" width="1200" height="42" fill="#17251a"/>
    <circle cx="24" cy="21" r="5" fill="#ff5f57"/>
    <circle cx="43" cy="21" r="5" fill="#febc2e"/>
    <circle cx="62" cy="21" r="5" fill="#28c840"/>

    <text x="88" y="26" fill="#81a88a" font-family="monospace" font-size="13">
      MARCOSBA // PERSONAL SYSTEM
    </text>

    <text x="1160" y="26" text-anchor="end" fill="#4c8058"
          font-family="monospace" font-size="12">
      ONLINE
    </text>

    <!-- Main title -->
    <text x="65" y="126" fill="#a4ffb0" font-family="monospace"
          font-size="58" font-weight="bold" filter="url(#glow)">
      MARCOSBA
    </text>

    <text x="68" y="164" fill="#6fc982" font-family="monospace"
          font-size="19" letter-spacing="4">
      OLD WEB / NEW MINDS
    </text>

    <!-- Animated terminal lines -->
    <g font-family="monospace" font-size="15" fill="#a1c9a5">
      <text x="70" y="218" opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.1;.9;1" dur="5s" repeatCount="indefinite"/>
        <tspan fill="#55d875">marcosba@localhost:~$</tspan>
        <tspan> whoami</tspan>
      </text>

      <text x="70" y="246" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.2;.3;1" dur="5s" repeatCount="indefinite"/>
        curious human / systems thinker
      </text>

      <text x="70" y="274" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;.4;.5;.6;1" dur="5s" repeatCount="indefinite"/>
        still exploring...
      </text>
    </g>

    <!-- Cursor -->
    <rect x="70" y="285" width="9" height="17" fill="#a4ffb0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Decorative system graphic -->
    <g transform="translate(950 165)" fill="none" stroke="#54d875">
      <circle r="91" stroke-width="1" opacity=".25"/>
      <circle r="70" stroke-width="1" stroke-dasharray="4 8" opacity=".6">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="35s" repeatCount="indefinite"/>
      </circle>
      <circle r="45" stroke-width="1.5" opacity=".7"/>
      <path d="M-110 0H110M0-110V110" opacity=".25"/>
      <path d="M-30-15L0-40L30-15L30 15L0 40L-30 15Z"
            stroke-width="2" filter="url(#glow)"/>
      <circle r="7" fill="#a4ffb0" filter="url(#glow)"/>
    </g>

    <!-- Scanline -->
    <rect x="0" y="0" width="1200" height="2" fill="#a4ffb0" opacity=".2">
      <animate attributeName="y" values="0;320;0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <text x="1160" y="300" text-anchor="end" fill="#42694a"
          font-family="monospace" font-size="11">
      EST. 1980s // STILL LOADING
    </text>
  </g>
</svg>
